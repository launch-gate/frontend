services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_API_URL: ${BASE_API_URL}
        SITE_URL: ${SITE_URL:-http://157.22.252.122:3000}
    image: launch-gate-frontend:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      BASE_API_URL: ${BASE_API_URL}
      SITE_URL: ${SITE_URL:-http://157.22.252.122:3000}
    ports:
      - "3000:3000"
    networks:
      ai_shared:
        aliases:
          - frontend

networks:
  ai_shared:
    name: launch-gate-shared
    external: true
